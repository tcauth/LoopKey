name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test .\LoopKey.slnx --configuration Release --nologo
      - run: dotnet publish .\src\LoopKey\LoopKey.csproj --configuration Release --output .\artifacts\win-x64 --nologo
      - name: Verify tag matches binary
        shell: powershell
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $actual = & .\artifacts\win-x64\loopkey.exe --version
          if ($actual -ne "loopkey $expected") {
            throw "Tag $env:GITHUB_REF_NAME does not match binary version '$actual'."
          }
          $hash = (Get-FileHash .\artifacts\win-x64\loopkey.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  loopkey.exe" |
            Set-Content .\artifacts\win-x64\loopkey.exe.sha256 -Encoding Ascii -NoNewline
      - name: Publish release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --generate-notes --title "$tag"
          fi
          gh release upload "$tag" \
            ./artifacts/win-x64/loopkey.exe \
            ./artifacts/win-x64/loopkey.exe.sha256 \
            --clobber
