name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test .\LoopKey.slnx --configuration Release --nologo
      - run: dotnet publish .\src\LoopKey\LoopKey.csproj --configuration Release --output .\artifacts\win-x64 --nologo
      - name: Verify tag matches binary
        shell: powershell
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart("v")
          $actual = & .\artifacts\win-x64\loopkey.exe --version
          if ($actual -ne "loopkey $expected") {
            throw "Tag $env:GITHUB_REF_NAME does not match binary version '$actual'."
          }
      - name: Publish release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --generate-notes --title $tag
          }
          gh release upload $tag .\artifacts\win-x64\loopkey.exe --clobber
