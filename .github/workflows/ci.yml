name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test .\LoopKey.slnx --configuration Release --nologo
      - run: dotnet publish .\src\LoopKey\LoopKey.csproj --configuration Release --output .\artifacts\win-x64 --nologo
      - name: Validate setup script
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\scripts\setup.ps1",
            [ref]$null,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify published version
        shell: powershell
        run: |
          [xml]$project = Get-Content .\src\LoopKey\LoopKey.csproj
          $expected = $project.Project.PropertyGroup.Version
          $version = & .\artifacts\win-x64\loopkey.exe --version
          if ($version -ne "loopkey $expected") {
            throw "Unexpected version: $version"
          }
