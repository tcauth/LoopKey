name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test .\LoopKey.slnx --configuration Release --nologo
      - run: dotnet publish .\src\LoopKey\LoopKey.csproj --configuration Release --output .\artifacts\win-x64 --nologo
